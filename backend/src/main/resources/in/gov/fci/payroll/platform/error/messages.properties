# Common error messages (English). Keys: error.<code>.title / error.<code>.detail.
# Details are shown to end users: never include request input or internal names.
error.COM-400-VALIDATION.title=Validation failed
error.COM-400-VALIDATION.detail=One or more fields are invalid.
error.COM-400-MALFORMED.title=Malformed request
error.COM-400-MALFORMED.detail=The request could not be read.
error.COM-400-JSON-KEY.title=Malformed request
error.COM-400-JSON-KEY.detail=The request contains a property name that is not allowed.
error.COM-400-PAGE.title=Page not available
error.COM-400-PAGE.detail=Choose one of the offered page sizes and a page number from 1.
error.COM-400-IDEMPOTENCY-KEY.title=Idempotency key required
error.COM-400-IDEMPOTENCY-KEY.detail=This operation requires a valid Idempotency-Key header.
error.COM-401-AUTH.title=Authentication required
error.COM-401-AUTH.detail=Please sign in to continue.
error.COM-403-DENIED.title=Access denied
error.COM-403-DENIED.detail=You do not have permission to perform this action.
error.COM-404-NOT-FOUND.title=Not found
error.COM-404-NOT-FOUND.detail=The requested resource was not found.
error.COM-405-METHOD.title=Method not allowed
error.COM-405-METHOD.detail=This operation is not supported on this resource.
error.COM-406-NOT-ACCEPTABLE.title=Not acceptable
error.COM-406-NOT-ACCEPTABLE.detail=The requested response format is not supported.
error.COM-409-CONFLICT.title=Conflict
error.COM-409-CONFLICT.detail=The request conflicts with the current state of the resource.
error.COM-409-DUPLICATE.title=Already exists
error.COM-409-DUPLICATE.detail=A record with the same unique value already exists.
error.COM-409-IDEMPOTENCY-BUSY.title=Request in progress
error.COM-409-IDEMPOTENCY-BUSY.detail=A request with this Idempotency-Key is still being processed.
error.COM-412-STALE.title=Record changed
error.COM-412-STALE.detail=The record was changed by someone else. Reload it and try again.
error.COM-413-TOO-LARGE.title=Request too large
error.COM-413-TOO-LARGE.detail=The request body is too large.
error.COM-415-MEDIA-TYPE.title=Unsupported media type
error.COM-415-MEDIA-TYPE.detail=The request content type is not supported.
error.COM-422-IDEMPOTENCY-MISMATCH.title=Idempotency key reused
error.COM-422-IDEMPOTENCY-MISMATCH.detail=This Idempotency-Key was already used for a different request.
error.COM-428-IF-MATCH.title=Version required
error.COM-428-IF-MATCH.detail=This update requires the If-Match header with the record version.
error.COM-429-RATE-LIMIT.title=Too many requests
error.COM-429-RATE-LIMIT.detail=Too many requests. Please wait and try again.
error.COM-422-EXPORT-TOO-LARGE.title=Export too large
error.COM-422-EXPORT-TOO-LARGE.detail=The list has more rows than one download may carry. Narrow the filter.
error.COM-503-EXPORT-BUSY.title=Exports busy
error.COM-503-EXPORT-BUSY.detail=Too many downloads are running. Please try again in a minute.
error.COM-500-INTERNAL.title=Unexpected error
error.COM-500-INTERNAL.detail=An unexpected error occurred. Quote the correlation id when contacting support.
error.COM-503-UNAVAILABLE.title=Service temporarily unavailable
error.COM-503-UNAVAILABLE.detail=The service is temporarily unavailable. Please try again shortly.
validation.unknown-property=This property is not allowed.
