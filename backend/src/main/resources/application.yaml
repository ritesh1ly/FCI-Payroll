# PLACEHOLDER HRMS export layout for X-07 (decision D-2) - local, dev and demo runs only. NOT FCI's
# format: no source describes the HRMS export, so the base configuration has none and a real
# deployment refuses uploads (HFB-503-FORMAT) until FCI's layout is configured under the same keys.
spring:
  config:
    activate:
      on-profile: "local | dev | demo"
fci:
  hrms-fallback:
    formats:
      ATTENDANCE_LEAVE:
        date-pattern: dd-MM-yyyy
        columns:
          employeeNumber: EMP_NO
          periodFrom: FROM_DATE
          periodTo: TO_DATE
          payDays: PAY_DAYS
          lwpDays: LWP_DAYS
          halfPayDays: HALF_PAY_DAYS
          otherLeaveCode: LEAVE_CODE
          otherLeaveDays: LEAVE_DAYS
      SUSPENSION_ABSCONDING:
        date-pattern: dd-MM-yyyy
        columns:
          employeeNumber: EMP_NO
          recordType: EVENT
          eventEffectiveDate: EFFECTIVE_DATE
          orderNo: ORDER_NO
          orderDate: ORDER_DATE
          issuingAuthority: ISSUED_BY
