# fci-api never translates user-facing messages (FCILekha i18n rule): every problem response carries
# messageKey = error.<code> and args, and the user interface renders it from its own bundle
# (i18n/messages_{en,hi}.properties). The English title and detail of
# each code are the defaults in ApiErrorCode; add an entry here only to override one.
#
# Server-generated documents (payslip PDF labels, report headers) will use messages_en and
# messages_hi bundles of their own when they are built; data values are never translated.
