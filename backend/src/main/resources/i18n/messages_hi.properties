m01.w.join.1m=INTF_PAY_EMP_BOB, अगले इंटरफ़ेस चक्र या घटना पर — डिज़ाइन के अनुसार यहाँ हाथ से जोड़ने की कोई क्रिया नहीं (§6.3.2)
