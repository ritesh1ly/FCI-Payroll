m01.w.join.2m=सभी HRMS फ़ील्ड भरे होते हैं; पेरोल फ़्लैग और नियंत्रण फ़ील्ड रिक्त होते हैं। CPF कोड और मूल क्षेत्र पेरोल में दर्ज नहीं होते — ये HRMS से आते हैं (§7.4.1)।
m01.w.join.3=स्थापना/मानव संसाधन पेरोल फ़ील्ड पूरे करता है
m01.w.join.3m=रिकॉर्ड संपादन से — पेरोल फ़्लैग (CCA, NPA, PLI, भोजन, धुलाई), रोक / भुगतान रोक, प्रभावी तिथि और कारण। वेतन पैटर्न, PF प्रकार और HRA शहर श्रेणी व्युत्पन्न हैं। CPF कोड: HRMS से प्राप्त, केवल पठनीय; CPF कटौती से पहले पेरोल जाँचता है कि वह मौजूद और अद्वितीय है (§7.4.1)।
m01.w.join.4=चेकर अनुमोदित करता है
m01.w.join.4m=किसी अन्य मास्टर परिवर्तन जैसा ही मेकर-चेकर द्वार (§6.5)
m01.w.join.5=स्थिति "सक्रिय" हो जाती है — अब पेरोल हेतु पात्र
m01.w.join.5m=अगले कर्मचारी/स्टाफ गणना रन (C-02) में शामिल
m01.w.join.note=जो कर्मचारी अभी पेरोल में नहीं हैं उन्हें खोजने हेतु — तालिका के ऊपर स्थिति फ़िल्टर में "पेरोल सेटअप लंबित — अभी पेरोल में नहीं" चुनें। टाइल भी वर्तमान गणना दिखाती है। यह इंटरफ़ेस मॉनिटर (X-03) से अलग है, जो HRMS फ़ीड का तकनीकी मिलान दिखाता है।
