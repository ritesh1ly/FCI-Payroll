pen.cap=Order capture — mandatory fields before submission
pen.cap.ref=Order / Sanction Reference
pen.cap.ref.m=The issuing authority's reference. Mandatory — §6.18.4 Step 1 blocks submission and names the outstanding item.
pen.cap.amt=Amount / basis and effective date
pen.cap.amt.m=Both mandatory; instalment terms where a schedule applies.
pen.cap.doc=Supporting document — mandatory attachment
pen.cap.doc.m=§6.4.3 makes attachment universal for order-backed transactions. Document Type (Sanction Order / Circular / Certificate / Other) and, for Sanction Order and Circular, a Document Reference Number. The Maker cannot submit and the Checker cannot approve with zero attachments — the Checker verifies against the order document (§6.18.4 Step 4).
pen.cap.bar=Bar / stoppage order
pen.cap.bar.m=§7.13.4 makes increment eligibility conditional on 'no bar/stoppage order on record, per Penalty module' — this screen is the named source of that flag, and I-05 consumes it.
pen.ctrl=Controls
pen.ctrl.ceiling=Aggregate deduction ceiling
pen.ctrl.ceiling.m=§6.18.4 Step 2 requires a cross-check against the same combined-deduction ceiling used in Loans & Advances; a breach extends the instalment and is flagged for Checker visibility. The ceiling is a configured percentage of gross.
pen.ctrl.periods=Recovery periods within open or future cycles
pen.ctrl.periods.m=§6.18.6 — a recovery period falling in a closed cycle is rejected.
pen.ctrl.tax=Tax treatment on taxable over-and-above
pen.ctrl.tax.m=§6.18.2 / §6.18.2 — an over-and-above payment posts with tax treatment applied where taxable.
pen.ctrl.retro=Retrospective penalty — impose, revise, cancel
pen.ctrl.retro.m=§6.18.2 / BR-PEN2-006 — a back-dated imposition, revision or cancellation is processed as a retrospective event, and a cancellation generates a reversing arrear linked to it in the audit trail. Routing through the retrospective engine is specified in FRS v0.4 for penalty (BR-PEN2-006), reimbursement (BR-ALLOW-008) and leave (BR-LEAVE-010).
pen.ctrl.post=Posting and auto-close
pen.ctrl.post.m=§6.18.4 Step 5 — posts to the next open monthly cycle, repeats each cycle, closes automatically on full recovery; recovery pauses on an F&F trigger.
