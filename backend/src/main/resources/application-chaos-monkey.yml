# Resilience runs (owner 2026-10-27): Chaos Monkey for Spring Boot on a local demo stack only.
# Active with the profile chaos-monkey in a WAR built with -Pfci.chaos=true (the library is not in
# the release build); StartupGuards refuse the profile in prod and in a UAT that is not a local
# demo stack. The monkey starts asleep: scripts/resilience/chaos-run.mjs switches the assaults on
# and off through the actuator endpoint on the management port (loopback only).
# Reference: docs/engineering/RESILIENCE_TESTING.md.

chaos:
  monkey:
    enabled: false
    watcher:
      controller: false
      rest-controller: true
      service: true
      repository: true
      component: false
    assaults:
      level: 5
      latency-active: false
      latency-range-start: 1000
      latency-range-end: 3000
      exceptions-active: false
      kill-application-active: false
      memory-active: false
      cpu-active: false

management:
  endpoint:
    chaosmonkey:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,scheduledtasks,chaosmonkey
