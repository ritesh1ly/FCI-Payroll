# Slow checks, by hand only (project owner, 2026-11-03: no scheduled run; Actions > nightly > Run workflow):
#   dependency-check  OWASP Dependency-Check of every Gradle configuration (fails on CVSS >= 7;
#                     suppressions with reasons in ci/dependency-check/suppressions.xml). Needs NVD_API_KEY.
# The Playwright suite does not run in GitHub Actions (project owner, 2026-10-25): it runs on a
# developer machine against a deployed local stack when asked (docs/engineering/DEVELOPER_PLAYBOOK.md).
name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # upload-sarif reads the workflow run (private repositories)
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate
      # Not available without GitHub Advanced Security on a private repository: never fails the run.
      - name: Findings to code scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: dependency-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: build/reports/dependency-check-report.*
