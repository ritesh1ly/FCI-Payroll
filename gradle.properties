# Build performance (Gradle best practices)
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# Daemon JVM. The --add-exports flags are required by google-java-format (Spotless) on Java 17+.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Project coordinates
group=in.gov.fci
version=0.1.0-SNAPSHOT

# Quality hard gates of the project owner (docs/quality/QUALITY_GATES.md), frontend and backend
# alike, as revised on 2026-11-03: LINE coverage 97 %, BRANCH coverage 95 %, mutation score (PIT
# here, Stryker in the frontend) 95 %; always aim at 100 %. The RECOMMENDATION is unchanged: 100 % lines, 100 % branches
# and 100 % mutation, above 95 % for the rest; critical features are 100 % from backend to frontend.
# Only the project owner changes a gate.
#
# Line and branch coverage of every suite together (unit, integration, batch; build-logic
# fci.java-conventions, Jacoco).
# OD-156 (owner 2026-11-09): coverage hard gates 85 % (line and branch) so the build runs in GitHub Actions; the
# recommendation stays 100 % and the code is well above (2026-11-09: 99.65 % / 98.55 %). Mutation stays 95 %.
fci.coverage.min-line=0.85
fci.coverage.min-branch=0.85
# PIT mutation score of the *.business.* rules (./gradlew :backend:pitest; CI job "mutation").
fci.pitest.min-mutation=95
# PIT timeout per mutant: constant + factor x the normal test time (owner 2026-11-03: generous, so a
# slow run under load is not counted as a kill; only a real infinite loop times out).
fci.pitest.timeout-ms=30000
fci.pitest.timeout-factor=4
# Critical features: 100 % line AND branch, class by class (Jacoco class names, '*' also matches the
# inner classes). The money, statutory and rule-engine rules, maker-checker, RBAC, OTP and audit
# classes belong here; a module adds its critical classes when it is built (playbook §4).
fci.coverage.critical-classes=\
  in.gov.fci.payroll.configuration.business.RuleFormula*,\
  in.gov.fci.payroll.configuration.business.RuleProposals*,\
  in.gov.fci.payroll.configuration.business.RuleScope,\
  in.gov.fci.payroll.configuration.business.RuleValueShape,\
  in.gov.fci.payroll.configuration.business.RuleVersionStatus,\
  in.gov.fci.payroll.configuration.business.SlabBands*,\
  in.gov.fci.payroll.configuration.api.RuleSet*,\
  in.gov.fci.payroll.configuration.api.RuleEngine*,\
  in.gov.fci.payroll.configuration.api.RuleVersionChanged*,\
  in.gov.fci.payroll.configuration.orchestration.RuleCatalogueService*,\
  in.gov.fci.payroll.configuration.orchestration.RuleCatalogueApprovalEffect*,\
  in.gov.fci.payroll.configuration.orchestration.RuleProposalChecks*,\
  in.gov.fci.payroll.configuration.web.RuleCatalogueController*
