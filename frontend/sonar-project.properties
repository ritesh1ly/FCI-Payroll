# SonarQube (frontend): npx sonar-scanner after `npm run check` (coverage/lcov.info). Token from the
# SONAR_TOKEN environment variable, host from SONAR_HOST_URL; never commit either.
sonar.projectKey=fci-payroll-frontend
sonar.projectName=FCILekha Payroll - frontend
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests,e2e
sonar.exclusions=src/generated/**,**/*.d.ts
sonar.test.inclusions=tests/**/*.{ts,tsx},e2e/**/*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
