# Single source of truth for versions (Gradle version catalog).
# Libraries managed by the Spring Boot BOM carry no version here; the BOM is applied as a platform
# by the fci.java-conventions plugin. Update with care: every change is gated by Dependency-Check.

[versions]
java = "25"
spring-boot = "4.1.1"
mapstruct = "1.6.3"
springdoc = "3.1.1"
resilience4j = "2.4.0"
bouncycastle = "1.86"
bucket4j = "8.21.0"
# List exports in Excel (SRS-G-13): the streaming .xlsx writer.
poi = "5.4.1"
# Server-side PDF (OD-144, LIB-1): payslip, Form 16 Part B, settlement statement, list and report
# exports. Apache PDFBox, Apache License 2.0 (the licence of POI), Java 8+ (runs on 25).
pdfbox = "3.0.8"
archunit = "1.5.1"
spring-modulith = "2.1.1"
jacoco = "0.8.15"
spotless = "8.10.4"
cyclonedx = "3.5.1"
dependency-check = "13.0.0"
# Static analysis: SpotBugs with the FindSecBugs security rules (SAST), and the SonarQube scanner.
spotbugs-plugin = "6.5.12"
spotbugs = "4.10.4"
findsecbugs = "1.14.0"
sonarqube = "6.0.1.5171"
# Mutation testing (PIT) of the business rules: ./gradlew :backend:pitest
pitest-plugin = "1.19.0"
pitest-core = "1.30.0"
pitest-junit5 = "1.2.3"
# Resilience testing only (owner 2026-10-27): in the WAR only when built with -Pfci.chaos=true.
chaos-monkey = "4.0.0"

[libraries]
chaos-monkey-spring-boot = { module = "de.codecentric:chaos-monkey-spring-boot", version.ref = "chaos-monkey" }
# Needed by Chaos Monkey's RestTemplate support (provided in its POM); chaos builds only.
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
# Platforms
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Managed by the Spring Boot BOM
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Boot 4 auto-configures Flyway only with its starter; Oracle support is a separate Flyway module (since Flyway 10).
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-oracle = { module = "org.flywaydb:flyway-database-oracle" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-session-jdbc = { module = "org.springframework.boot:spring-boot-starter-session-jdbc" }
# The JDBC job repository (BATCH_* tables); plain spring-boot-starter-batch is resourceless in Boot 4.
spring-boot-starter-batch-jdbc = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# Supplied by the external Tomcat 11 at runtime (ADR-0016): only these jars are "provided".
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Outbound WebClient of the HRMS client (owner 2026-11-05); Reactor Netty is its pooled connector.
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Boot 4 test slices are modular: MockMvc auto-configuration, security and batch test support.
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-batch-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
h2 = { module = "com.h2database:h2" }
# Oracle 19c+ (ADR-0019; local runs on Oracle 26ai ADB, feature/Oracle): the JDBC driver for JDK 17+
# and the PKI provider that reads the Autonomous Database wallet (cwallet.sso).
ojdbc17 = { module = "com.oracle.database.jdbc:ojdbc17" }
oraclepki = { module = "com.oracle.database.security:oraclepki" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }

# Not managed by the Spring Boot BOM
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead", version.ref = "resilience4j" }
spring-batch-test = { module = "org.springframework.batch:spring-batch-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Modular monolith: module declarations (main) and the module-structure verification (architectureTest).
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api", version.ref = "spring-modulith" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-core", version.ref = "spring-modulith" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs", version.ref = "spring-modulith" }

# Gradle plugins used by build-logic convention plugins (plugin marker artefacts)
gradle-plugin-spring-boot = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "spring-boot" }
gradle-plugin-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
gradle-plugin-cyclonedx = { module = "org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin", version.ref = "cyclonedx" }
gradle-plugin-spotbugs = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugs-plugin" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
