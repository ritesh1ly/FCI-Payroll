# /etc/nginx/nginx.conf for FCILekha Payroll (NGINX 1.30.5). The FCI files live under
# /etc/nginx/fci/ (conf.d, snippets, generated); relative includes resolve against /etc/nginx/.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# A reload (certificate renewal, config change) never waits forever on old workers' long requests.
worker_shutdown_timeout 30s;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    # Slow-client and oversized-request limits (Tomcat enforces its own limits as well).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # Static assets and pages only. /api responses are never compressed (BREACH; strong ETags for If-Match).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript image/svg+xml text/html;

    # Shared cache of the content-hashed Next.js build assets only (/nginx/_next/static/: the same
    # file for everyone, never personal, never changed under its name): after a release the first
    # request of each file fills it, so a salary-day surge of first visits does not reach the
    # Next.js server, and the assets are still served while it restarts. Pages and /api are never
    # cached here (personal, session-bound). Bounded: 8 MB of keys (about 64,000 files), 1 GB of
    # files, an entry unused for 30 days dropped.
    proxy_cache_path /var/cache/fci-nginx/static levels=1:2 keys_zone=fci_static:8m max_size=1g
                     inactive=30d use_temp_path=off;

    # Correlation id: the browser's id when well formed (same rule as the backend MdcFilter),
    # otherwise NGINX's own request id. Forwarded to Tomcat and written to every access log line.
    map $http_x_correlation_id $fci_correlation_id {
        "~^[A-Za-z0-9-]{8,64}$" $http_x_correlation_id;
        default $request_id;
    }

    # ECS-style JSON access log. $uri, not $request_uri: query strings can carry search terms or
    # e-mail addresses. Kept 180 days by logrotate (CERT-In), see config/logrotate/fci-nginx.
    log_format fci_json escape=json
        '{"@timestamp":"$time_iso8601",'
        '"client.ip":"$remote_addr",'
        '"http.request.method":"$request_method",'
        '"url.path":"$uri",'
        '"http.version":"$server_protocol",'
        '"http.response.status_code":$status,'
        '"http.response.body.bytes":$body_bytes_sent,'
        '"event.duration_s":$request_time,'
        '"upstream.response_time":"$upstream_response_time",'
        '"trace.id":"$fci_correlation_id",'
        '"tls.version":"$ssl_protocol",'
        '"user_agent.original":"$http_user_agent",'
        '"service.name":"nginx"}';
    access_log /var/log/nginx/fci-access.json fci_json;

    # Flood protection in front of the backend's own per-IP and per-user limits (ADR-0008), sized
    # for the salary-day peak (owner 2026-10-25: 1,000 - 5,000 users active at once). The key is the
    # client address, and an FCI office reaches the service from one NAT address: the limits admit
    # about 500 active staff behind one address (a screen opens with a burst of 6 - 8 API calls,
    # then the user reads it), while a single flooding client is still cut off. Brute force on
    # sign-in stays bounded by the backend's per-identity limit and the lockout after five failures.
    #
    # Behind the OCI load balancer the address must be the client's, not the balancer's, or every
    # user shares one bucket: set the balancer's subnet here (FCI IT; PENDING 08-nginx-real-ip):
    #   set_real_ip_from <load-balancer subnet>;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=fci_auth:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=fci_api:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=fci_pages:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=fci_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # Each refusal is logged (error log, warn) for the flood / brute-force monitoring of the SOC.
    limit_req_log_level warn;
    limit_conn_log_level warn;

    include fci/conf.d/*.conf;
}
