# TLS (Mozilla "intermediate", ASVS 9.1): TLS 1.2 and 1.3, AEAD ciphers with forward secrecy only.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_timeout 1d;
ssl_session_cache shared:FCI_TLS:10m;
# Tickets would weaken forward secrecy unless their keys are rotated; the session cache suffices.
ssl_session_tickets off;

# OCSP stapling for the CA-issued certificate (ignored, with a warning, for self-signed ones).
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
