# Proxy to the online backend instance (Tomcat /api). Included by the /api locations.
proxy_pass http://fci_online;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# NGINX is the edge: overwrite, never append, so a client cannot inject an address that the
# Tomcat RemoteIpValve would trust.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_set_header X-Correlation-Id $fci_correlation_id;

proxy_connect_timeout 3s;
proxy_send_timeout 15s;
# proxy_read_timeout: 15 s from the server block (fci-payroll.conf); downloads set their own.
proxy_redirect off;
proxy_buffering on;
proxy_request_buffering on;
# Never retry on another attempt: POSTs are not safe to repeat (the backend uses Idempotency-Key
# for that).
proxy_next_upstream off;
proxy_intercept_errors off;
# NGINX's own refusals and an unreachable / timed-out backend: problem+json (fci-payroll.conf).
error_page 429 = @api_rate_limited;
error_page 502 503 504 = @api_unavailable;

# No compression of API responses: BREACH (CSRF token and reflected input in one response) and
# NGINX would weaken the strong ETags needed for If-Match.
gzip off;

# Headers NGINX sets itself (security-headers.conf), so they are not sent twice.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-XSS-Protection;
proxy_hide_header X-Powered-By;

include fci/snippets/security-headers.conf;
# JSON needs no capabilities at all.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; sandbox" always;
