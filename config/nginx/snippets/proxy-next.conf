# Proxy to the Next.js server. Included by the page and asset locations.
proxy_pass http://fci_next;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# NGINX is the edge: overwrite, never append.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_set_header X-Correlation-Id $fci_correlation_id;

proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 20s;
proxy_redirect off;
proxy_buffering on;
proxy_next_upstream off;
proxy_intercept_errors off;
# The Next.js server unreachable or timed out: a plain notice instead of NGINX's error page.
error_page 502 503 504 = @page_unavailable;

# Headers NGINX sets itself (security-headers.conf). The page Content-Security-Policy is Next.js's
# own (per-request nonce) and passes through.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header X-Powered-By;

include fci/snippets/security-headers.conf;
