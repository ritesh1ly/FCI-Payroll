# FCILekha Payroll site (ADR-0010, ADR-0016): one origin, two upstreams.
#   /nginx/fci-payroll/** -> the online backend instance (Tomcat, context /api): login, session, business APIs
#   /nginx/**  -> the Next.js server (server-side rendered pages and its static assets), under the base
#                 path /nginx of next.config.ts (owner 2026-10-31: the pages are published under /nginx,
#                 as the shared server has them); any other path outside /api/ is sent there.
# Token checks and API logging are in the backend's Spring Security filters; NGINX adds TLS, flood
# limits and the security headers. There is no separate API gateway.

# Plain HTTP: redirect only, to the service's own name (never to the Host the client sent: no open
# redirect through a forged Host header). Any other host name on port 80 gets no answer.
server {
    listen 80;
    listen [::]:80;
    include fci/snippets/server-name.conf;
    access_log /var/log/nginx/fci-access.json fci_json;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log /var/log/nginx/fci-access.json fci_json;
    return 444;
}

# Requests for any other host name (IP scans, Host header tricks) get no certificate and no answer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include fci/snippets/server-name.conf;

    ssl_certificate /etc/nginx/tls/fci-payroll.crt;
    ssl_certificate_key /etc/nginx/tls/fci-payroll.key;
    include fci/snippets/tls.conf;

    # One HTTP/2 connection per browser: about 500 browsers of one office with room to spare.
    limit_conn fci_conn 1000;

    # The interactive API answers within 15 s (the 3 s SLA with margin); downloads and pages set
    # their own (75 s, 20 s).
    proxy_read_timeout 15s;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) {
        return 405;
    }

    # Liveness of the edge for the load balancer (no backend call, not logged).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    # NGINX's connection counters for the monitoring agent on the host (nginx-prometheus-exporter);
    # never from outside.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # NGINX's own refusals and upstream outages as the API's problem+json, so the screens show the
    # translated message (error.COM-429-RATE-LIMIT, error.COM-503-UNAVAILABLE) with a Retry-After.
    location @api_rate_limited {
        include fci/snippets/security-headers.conf;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        default_type application/problem+json;
        return 429 '{"status":429,"title":"Too many requests","errorCode":"COM-429-RATE-LIMIT","correlationId":"$fci_correlation_id"}';
    }
    location @api_unavailable {
        include fci/snippets/security-headers.conf;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        default_type application/problem+json;
        return 503 '{"status":503,"title":"Service unavailable","errorCode":"COM-503-UNAVAILABLE","correlationId":"$fci_correlation_id"}';
    }
    # Pages: a plain bilingual notice (no script, no style: nothing for the CSP to allow).
    location @page_unavailable {
        include fci/snippets/security-headers.conf;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        default_type text/html;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><title>FCI Lekha</title><h1>FCI Lekha</h1><p>The service is temporarily unavailable. Please try again in a minute.</p><p lang="hi">सेवा अस्थायी रूप से उपलब्ध नहीं है। कृपया एक मिनट बाद पुनः प्रयास करें।</p><p>Reference: $fci_correlation_id</p></html>';
    }

    # Map the public API prefix to the backend context, then select the existing API locations
    # so auth limits, upload limits, download timeouts and private endpoint blocks still apply.
    # NGINX checks the declared body size against the location it is in BEFORE the rewrite runs, so
    # this location must allow the largest body of any API location (the upload locations below,
    # 11 MB = the backend's multipart max-request-size: 10 MB file + form fields). After the rewrite
    # the API location found checks again: every non-upload body is still held to the 1 MB default.
    # (Found 2026-11-02: every upload over 1 MB from the pages got 413 here.)
    location ^~ /nginx/fci-payroll/ {
        client_max_body_size 11m;
        rewrite ^/nginx/fci-payroll/(.*)$ /api/$1 last;
    }

    # Never reachable from outside, whatever the backends do.
    location ^~ /api/actuator { return 404; }
    location ^~ /api/v3/api-docs { return 404; }
    location ^~ /api/swagger-ui { return 404; }
    location ~ /\. { return 404; }

    # Sign-in, its OTP (password, mobile, resend), the step-up OTP and the password endpoints: tight
    # flood limit (the backend adds per-IP and per-user limits, five attempts per code, the hourly
    # code cap, and locks an account after five failures).
    location ~ ^/api/auth/(login|password/|step-up) {
        limit_req zone=fci_auth burst=60 nodelay;
        include fci/snippets/proxy-api.conf;
    }

    # File uploads (order copies, circular PDFs, X-07 files, the label CSV): up to the backend's
    # spring.servlet.multipart.max-request-size (11 MB); the backend checks each file's type, size and
    # content. Every other API body keeps the 1 MB default of nginx.conf. A NEW upload endpoint must
    # be added here, or NGINX refuses its files above 1 MB with 413 before the backend sees them.
    location ~ ^/api/v1/(settlement-cases/[0-9]+/orders|leave-encashment-arrears/[0-9]+/documents|masters/circulars|masters/labels/upload|masters/staff-rates/versions/[0-9]+/order|cycles/[0-9-]+/order|off-cycle/[0-9]+/order|supplementary|hrms-fallback/uploads(/[0-9]+/order)?|claims/[0-9]+/documents|cpf/opening-balance-corrections|cpf/deputation-entries|cpf/sanctions/[0-9]+/documents|arrear-events/[0-9]+/documents|mdp-transactions/[0-9]+/documents|tax/declarations/mine|tax/declarations/[0-9]+/orders|tax/savings/members/[0-9A-Za-z]+/entries|tax/form16-certificates/[0-9]+/part-a|tax/challans/import|tax/returns/[0-9]+/filings|loans/sanctions|penalties|penalties/[0-9]+/(revokes|cancellations)|loans/[0-9]+/(foreclosures|reschedules|orders)|hrms-update-requests/(mine/)?[0-9]+/documents|hrms-change-tasks/[0-9]+/documents|pay-fixation-cases/orders|pay-scales/[0-9A-Za-z-]+/orders|hrms-change-orders/copies|settlement-cases/[0-9]+/(ex-gratia|recoveries/[0-9]+/source)|labour/members/[0-9]+/(corrections|reinstatements|documents)|employees/[0-9A-Za-z]+/((allowance|control)-flags|transfer-orders|documents))$ {
        client_max_body_size 11m;
        limit_req zone=fci_api burst=1000 nodelay;
        include fci/snippets/proxy-api.conf;
    }

    # Downloads (exports, reports, stored files): up to a minute to produce (the download SLA), so a
    # longer read timeout than the interactive API; the backend bounds concurrent exports itself
    # (COM-503-EXPORT-BUSY).
    location ~ ^/api/v1/.+/(export|report)$|^/api/v1/.+/files/[0-9]+$ {
        limit_req zone=fci_api burst=1000 nodelay;
        include fci/snippets/proxy-api.conf;
        proxy_read_timeout 75s;
    }

    location /api/ {
        limit_req zone=fci_api burst=1000 nodelay;
        include fci/snippets/proxy-api.conf;
    }

    # Content-hashed build assets of Next.js: cache for a year in the browser, and in NGINX's
    # shared cache (nginx.conf fci_static). The key is the path alone (no query string, no cookie);
    # only a 200 is kept (an asset missing during a release is asked again); one request fills an
    # entry while the others wait (no stampede); while Next.js is down a kept file is still served.
    location ^~ /nginx/_next/static/ {
        limit_except GET { deny all; }
        access_log off;
        include fci/snippets/proxy-next.conf;
        proxy_cache fci_static;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Nothing session-related is ever stored with a shared file.
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Pages: rendered per request by Next.js (session-aware), which also sets the page CSP with a
    # per-request nonce (frontend/src/proxy.ts). Never cached. Next.js serves the base path itself
    # without a trailing slash (/nginx), the pages below it (/nginx/payroll, ...).
    location = /nginx {
        limit_except GET { deny all; }
        limit_req zone=fci_pages burst=250 nodelay;
        include fci/snippets/proxy-next.conf;
    }
    location /nginx/ {
        limit_except GET { deny all; }
        limit_req zone=fci_pages burst=250 nodelay;
        include fci/snippets/proxy-next.conf;
    }

    # The bare host name: the sign-in page in one hop.
    location = / {
        return 302 /nginx;
    }

    # Any other path (an old link or bookmark to /payroll...): the same page under /nginx. The API,
    # the health check and the status page are matched above.
    location / {
        limit_except GET { deny all; }
        return 302 /nginx$request_uri;
    }
}
