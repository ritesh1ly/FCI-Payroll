# Backends on the same host (ADR-0016). Only the ONLINE backend instance is ever proxied: the batch
# instance (ports 8090/8091) has no route from NGINX at all.
upstream fci_online {
    server 127.0.0.1:8080;
    # Idle keep-alive connections; shorter than Tomcat's keepAliveTimeout (20 s).
    keepalive 32;
    keepalive_timeout 15s;
}

# The Next.js server (server-side rendering, node server.js). Its KEEP_ALIVE_TIMEOUT (20 s, fci-frontend.service,
# deploy-local.ps1) must stay longer than this keepalive_timeout, or NGINX reuses a closed connection (502).
upstream fci_next {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 15s;
}
